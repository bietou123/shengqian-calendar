<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0f14" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0f14'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23d9a441'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%232a1e0a'%3E%C2%A5%3C/text%3E%3C/svg%3E"
    />
    <title>省钱日历</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 顶部 -->
      <header class="topbar" id="topbar">
        <div class="topbar-main">
          <h1 id="page-title">今日</h1>
          <p class="topbar-sub" id="page-sub">—</p>
        </div>
        <button class="icon-btn" id="btn-guide" aria-label="避坑指南">避坑</button>
      </header>

      <main id="main">
        <!-- 今日 -->
        <section class="page" id="page-today">
          <div class="hero">
            <div class="hero-label">今天预计可省</div>
            <div class="hero-value"><span id="today-total">0</span><small>元</small></div>
            <div class="hero-meta" id="today-meta">— 条可做 · 预计耗时 — 分钟</div>
          </div>
          <p class="disclaimer-note">收益以平台规则为准，攻略仅供参考，不保证可得。</p>
          <div class="section-head">
            <h2>今天该做什么</h2>
            <span class="section-count" id="today-count">0</span>
          </div>
          <div id="today-list" class="list"></div>
        </section>

        <!-- 攻略库 -->
        <section class="page" id="page-library" hidden>
          <div class="search-wrap">
            <input id="search" type="search" placeholder="搜索玩法、平台、场景" autocomplete="off" />
          </div>
          <div class="chips" id="cat-chips"></div>
          <div class="filters">
            <button class="filter-btn" data-filter="wage">按折合时薪</button>
            <button class="filter-btn" data-filter="fast">只看 5 分钟内</button>
            <button class="filter-btn" data-filter="low">低门槛</button>
            <button class="filter-btn" data-filter="fav">收藏</button>
          </div>
          <div class="section-head">
            <h2>攻略</h2>
            <span class="section-count" id="lib-count">0</span>
          </div>
          <div id="lib-list" class="list"></div>
        </section>

        <!-- 台账 -->
        <section class="page" id="page-ledger" hidden>
          <div class="stat-row">
            <div class="stat">
              <div class="stat-label">本月已省</div>
              <div class="stat-value"><span id="ledger-month">0</span><small>元</small></div>
            </div>
            <div class="stat">
              <div class="stat-label">累计已省</div>
              <div class="stat-value"><span id="ledger-total">0</span><small>元</small></div>
            </div>
          </div>
          <div class="card chart-card">
            <div class="card-head">
              <h3>近 6 个月</h3>
              <span class="muted" id="chart-note">现金 + 抵扣</span>
            </div>
            <canvas id="chart" height="150"></canvas>
          </div>
          <div class="section-head">
            <h2>记录</h2>
            <span class="section-count" id="ledger-count">0</span>
          </div>
          <div id="ledger-list" class="list"></div>
        </section>

        <!-- 我的 -->
        <section class="page" id="page-me" hidden>
          <div class="profile-card">
            <div class="profile-ring">
              <span id="me-done">0</span>
              <small>已完成</small>
            </div>
            <div class="profile-info">
              <div class="profile-name">本机账号</div>
              <div class="muted" id="me-since">数据只保存在这台设备</div>
            </div>
          </div>
          <div class="grid-stats">
            <div class="mini-stat"><b id="me-fav">0</b><span>收藏</span></div>
            <div class="mini-stat"><b id="me-records">0</b><span>记账</span></div>
            <div class="mini-stat"><b id="me-days">0</b><span>打卡天数</span></div>
          </div>

          <div class="menu">
            <button class="menu-item" id="menu-avoid">
              <span>避坑指南</span><span class="chev">›</span>
            </button>
            <button class="menu-item" id="menu-notify">
              <span>每日提醒</span><span id="notify-state" class="muted">未开启</span>
            </button>
            <button class="menu-item" id="menu-export">
              <span>导出数据</span><span class="chev">›</span>
            </button>
            <button class="menu-item" id="menu-clear">
              <span class="danger-text">清空本机数据</span><span class="chev">›</span>
            </button>
          </div>

          <div class="about">
            <div class="about-title">省钱日历 <span id="about-ver">v0.1.0</span></div>
            <p class="muted">
              离线工具，不收集任何个人信息，不联网上传数据。所有金额均为预估区间，实际以平台当期活动规则为准。
            </p>
          </div>
        </section>
      </main>

      <!-- 底部导航 -->
      <nav class="tabbar" id="tabbar">
        <button class="tab active" data-tab="today">
          <span class="tab-ico">◎</span><span>今日</span>
        </button>
        <button class="tab" data-tab="library">
          <span class="tab-ico">≡</span><span>攻略</span>
        </button>
        <button class="fab" id="fab-add" aria-label="记一笔">＋</button>
        <button class="tab" data-tab="ledger">
          <span class="tab-ico">▤</span><span>台账</span>
        </button>
        <button class="tab" data-tab="me">
          <span class="tab-ico">☺</span><span>我的</span>
        </button>
      </nav>
    </div>

    <!-- 详情抽屉 -->
    <div class="sheet-mask" id="sheet-mask" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="sheet-grab"></div>
        <div id="sheet-body"></div>
        <div class="sheet-actions" id="sheet-actions"></div>
      </div>
    </div>

    <!-- 记一笔 -->
    <div class="sheet-mask" id="add-mask" hidden>
      <div class="sheet" id="add-sheet" role="dialog" aria-modal="true">
        <div class="sheet-grab"></div>
        <h2 class="sheet-title">记一笔</h2>
        <div class="seg" id="add-type">
          <button class="seg-item active" data-type="cash">现金</button>
          <button class="seg-item" data-type="discount">抵扣券</button>
          <button class="seg-item" data-type="goods">实物</button>
        </div>
        <label class="field">
          <span>金额（元）</span>
          <input id="add-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" />
        </label>
        <label class="field">
          <span>备注</span>
          <input id="add-note" type="text" maxlength="40" placeholder="例如：周三外卖满减" />
        </label>
        <div class="field">
          <span>关联攻略（可选）</span>
          <select id="add-guide">
            <option value="">不关联</option>
          </select>
        </div>
        <div class="sheet-actions">
          <button class="btn ghost" id="add-cancel">取消</button>
          <button class="btn primary" id="add-save">保存</button>
        </div>
      </div>
    </div>

    <!-- 应用内确认框（不用系统 confirm，避免白底英文按钮） -->
    <div class="sheet-mask" id="ask-mask" hidden>
      <div class="sheet" id="ask-sheet" role="dialog" aria-modal="true">
        <div class="sheet-grab"></div>
        <h2 class="sheet-title" id="ask-title">提示</h2>
        <p class="ask-body" id="ask-body"></p>
        <div class="field" id="ask-time-field" hidden>
          <span>每天几点提醒</span>
          <div class="time-row">
            <select id="ask-hour" aria-label="小时"></select>
            <span class="time-sep">:</span>
            <select id="ask-min" aria-label="分钟"></select>
          </div>
        </div>
        <div class="sheet-actions" id="ask-actions"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
